<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="calculator">
      <div id="display-container">
        <div id="equation">Ans = 0</div>
        <div id="operand-and-result-display">0</div>
      </div>
      <div id="btns">
        <div class="row">
          <button>CE</button>
          <button>AC</button>
        </div>
        <div class="row">
          <button>7</button>
          <button>8</button>
          <button>9</button>
          <button class="special">÷</button>
        </div>
        <div class="row">
          <button>4</button>
          <button>5</button>
          <button>6</button>
          <button class="special">×</button>
        </div>
        <div class="row">
          <button>1</button>
          <button>2</button>
          <button>3</button>
          <button class="special">−</button>
        </div>
        <div class="row">
          <button>0</button>
          <button>.</button>
          <button class="blue">=</button>
          <button class="special">+</button>
        </div>
      </div>
    </div>
  </body>
</html>
