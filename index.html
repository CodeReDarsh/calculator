<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <div id="calculator">
      <div id="display-container">0</div>
      <div id="btns">
        <div class="row">
          <button type="button" value="CE">CE</button>
          <button type="button" value="AC">AC</button>
        </div>
        <div class="row">
          <button type="button" value="7">7</button>
          <button type="button" value="8">8</button>
          <button type="button" value="9">9</button>
          <button type="button" value="/" class="operator">÷</button>
        </div>
        <div class="row">
          <button type="button" value="4">4</button>
          <button type="button" value="5">5</button>
          <button type="button" value="6">6</button>
          <button type="button" value="*" class="operator">×</button>
        </div>
        <div class="row">
          <button type="button" value="1">1</button>
          <button type="button" value="2">2</button>
          <button type="button" value="3">3</button>
          <button type="button" value="-" class="operator">−</button>
        </div>
        <div class="row">
          <button type="button" value="0">0</button>
          <button type="button" value=".">.</button>
          <button type="button" value="=" class="blue">=</button>
          <button type="button" value="+" class="operator">+</button>
        </div>
      </div>
    </div>
    <footer>Made by <a style="color: red" target="_blank" href="https://github.com/CodeReDarsh">Jesse</a> | 2026</footer>
  </body>
</html>
